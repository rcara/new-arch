{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<h1>Connexion</h1>
{% if errors.form %}<p class="error" role="alert">{{ errors.form }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next_url }}">
  <label>Identifiant <input name="username" required autocomplete="username" value="{{ form.get('username', '') }}"></label>
  <label>Mot de passe <input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
  <button type="submit">Se connecter</button>
</form>
{% endblock %}
